services:
  reachy2:
    image: docker.io/pollenrobotics/reachy2
    container_name: reachy2-emotions
    platform: linux/amd64
    ports:
      - "8888:8888"   # Jupyter
      - "6080:6080"   # noVNC
      - "50051:50051" # gRPC
      - "50065:50065" # optional
    restart: unless-stopped
    command: >
      start_rviz:=true
      start_sdk_server:=true
      fake:=true
      orbbec:=false
      gazebo:=true
      
  emotions:
    build:
      context: .
      dockerfile: Dockerfile.emotions
    image: reachy2-emotions:local
    depends_on:
      - reachy2
    environment:
      - REACHY_IP=reachy2-emotions
    ports:
      - "5001:5001"   # Flask API
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: Dockerfile
    image: reachy2-console:local
    depends_on:
      - emotions
    env_file:
      - .env
    environment:
      - PORT=3000
    expose:
      - "3000"
    volumes:
      - ./session_logs:/usr/src/app/session_logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: reachy2-nginx
    depends_on:
      - console
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

networks:
  default:
    name: reachy2-net
